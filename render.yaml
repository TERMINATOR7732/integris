services:
  - type: web
    name: integris-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:4173"
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
